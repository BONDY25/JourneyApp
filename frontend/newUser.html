<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>New User</title>
    <link href="styles/styles-ny.css" rel="stylesheet"/>
    <link rel="icon" type="image/png" href="assets/JourneyApp-logo-1.png"/>
</head>
<body>

<!-- =========================================================================================================== -->
<!-- Message Box Overlay -->
<!-- =========================================================================================================== -->

<div id="message-box" class="message-box-card hidden">
    <div class="message-box-header">
        <div class="message-box-content">
            <span id="message-box-title" class="message-box-title">Title</span>
            <p id="message-box-message" class="message-box-message">Message</p>
        </div>
        <div class="message-box-actions">
            <button id="message-box-btn1" class="message-box-btn1" type="button">Button 1</button>
            <button id="message-box-btn2" class="message-box-btn2" type="button">Button 2</button>
        </div>
    </div>
</div>

<!-- =========================================================================================================== -->
<!-- Loader Overlay -->
<!-- =========================================================================================================== -->

<div id="loader" class="loader-overlay">
    <span class="loader"></span>
</div>

<!-- =========================================================================================================== -->
<!-- App Container -->
<!-- =========================================================================================================== -->

<div id="app" class="app">

    <!-- =========================================================================================================== -->
    <!-- User Create -->
    <!-- =========================================================================================================== -->

    <div class="login" id="add-container">
        <form id="user-create-form" class="input-container">
            <label for="username">Username</label>
            <input type="text" id="username" required
                   autocomplete="off" maxlength="12">

            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="off" maxlength="255">

            <label for="password-confirm">Confirm Password</label>
            <input type="password" id="password-confirm" required autocomplete="off" maxlength="255">

            <label for="robot">Are you a robot?</label>
            <input type="text" id="robot" required placeholder='Type "I am not a robot."'
                   autocomplete="off" maxlength="255">
        </form>
        <div class=button-group>
            <button type="submit" id="btnCreate" class="button">Register</button>
            <button id="btnBack" class="button">Back</button>
        </div>
    </div>

</div>

<!-- =========================================================================================================== -->
<!-- Scripts -->
<!-- =========================================================================================================== -->

<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script type="module" src="js/newUser.js"></script>
<script>console.log('⚠️ This is property of Aiden Bond. Any attempt to copy it will result in a stern talking to by the rozzers!👮⚠️');</script>
</body>
</html>
