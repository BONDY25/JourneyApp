<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Journey App - Your Vehicles</title>
    <link href="styles/styles-yv.css" rel="stylesheet"/>
    <link rel="icon" type="image/png" href="assets/JourneyApp-logo-1.png"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
</head>
<body>

<!-- =========================================================================================================== -->
<!-- Message Box Overlay -->
<!-- =========================================================================================================== -->

<div id="message-box" class="message-box-card hidden">
    <div class="message-box-header">
        <div class="message-box-content">
            <span id="message-box-title" class="message-box-title">Title</span>
            <p id="message-box-message" class="message-box-message">Message</p>
        </div>
        <div class="message-box-actions">
            <button id="message-box-btn1" class="message-box-btn1" type="button">Button 1</button>
            <button id="message-box-btn2" class="message-box-btn2" type="button">Button 2</button>
        </div>
    </div>
</div>

<!-- =========================================================================================================== -->
<!-- Loader Overlay -->
<!-- =========================================================================================================== -->

<div id="loader" class="loader-overlay hidden">
    <span class="loader"></span>
</div>

<!-- =========================================================================================================== -->
<!-- Journey Details Overlay -->
<!-- =========================================================================================================== -->

<div id="vehicle-details" class="journey-details-overlay hidden">
    <div class="journey-details-card">
        <span id="btnClose" class="material-symbols-outlined close-button">close</span>
        <div id="stats">
            <h1>Vehicle Details</h1>
            <form id="journey-form">
                <!-- Vehicle Name -->
                <label for="vehicle-name">Name</label>
                <input type="text" id="vehicle-name" autocomplete="off" required>

                <!-- Vehicle model -->
                <label for="vehicle-model">Make & Model</label>
                <input type="text" id="vehicle-model" autocomplete="off" required>

                <!-- Fuel type -->
                <label for="fuelType">Fuel Type</label>
                <select id="fuelType">
                    <option value="Petrol">Petrol</option>
                    <option value="Diesel">Diesel</option>
                </select>

                <!-- Tank Volume -->
                <label for="tankVolume">Tank Volume (L)</label>
                <input type="number" id="tankVolume" step="0.1" min="0" autocomplete="off"/>

                <!-- last Fuel Cost -->
                <label for="lastCostPL">Last Cost per L(£)</label>
                <input type="number" id="lastCostPL" step="0.001" autocomplete="off" required>

                <button class="button" id="btnSave">Save</button>
            </form>
        </div>
    </div>
</div>

<div id="app" class="app">
    <!-- =========================================================================================================== -->
    <!-- App Container -->
    <!-- =========================================================================================================== -->

    <h1>Your Vehicles</h1>
    <div id="table-container" class="stats">
        <table id="vehicle-table">
            <tbody>
            <!-- rows will go here dynamically -->
            </tbody>
        </table>
    </div>
    <div class=button-group>
        <button class="button" id="btnAdd">New Vehicle</button>
        <button class="button" id="btnBack">Back</button>
    </div>
</div>

<!-- =========================================================================================================== -->
<!-- Navigation Bar -->
<!-- =========================================================================================================== -->

<div id="nav-bar">
    <a href="home.html" class="nav-item" id="nav-home">
        <span class="material-symbols-outlined">home</span>
        <span class="label">Home</span>
    </a>
    <a href="new-journey.html" class="nav-item" id="nav-add">
        <span class="material-symbols-outlined">add_circle</span>
        <span class="label">Add</span>
    </a>
    <a href="your-journeys.html" class="nav-item" id="nav-journeys">
        <span class="material-symbols-outlined">directions_car</span>
        <span class="label">Journeys</span>
    </a>
    <a href="full-stats.html" class="nav-item" id="nav-stats">
        <span class="material-symbols-outlined">query_stats</span>
        <span class="label">Stats</span>
    </a>
    <a href="settings.html" class="nav-item" id="nav-settings">
        <span class="material-symbols-outlined">person</span>
        <span class="label">Profile</span>
    </a>
</div>


<!-- =========================================================================================================== -->
<!-- Scripts -->
<!-- =========================================================================================================== -->

<script type="module" src="js/vehicles.js"></script>

</body>
</html>
